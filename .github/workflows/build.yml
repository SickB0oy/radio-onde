name: Compiler l'APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Lire la version
        id: version
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Préparer la clé de signature
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Il manque les secrets KEYSTORE_BASE64 et/ou KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      - name: Compiler
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Renommer l'APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/RadioOnde-v${{ steps.version.outputs.name }}.apk

      - name: Mettre l'APK à disposition
        uses: actions/upload-artifact@v4
        with:
          name: RadioOnde-apk
          path: dist/*.apk

      # Chaque envoi sur main publie (ou met à jour) la version « v<versionName> » dans Releases.
      # Pour une nouvelle version, augmenter versionCode et versionName dans app/build.gradle.kts.
      - name: Publier la version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Radio Onde ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          generate_release_notes: true
