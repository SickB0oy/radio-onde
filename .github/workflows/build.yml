name: Compiler l'APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Lire la version
        id: version
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      # Contours des continents pour le globe : Natural Earth 1:110m (domaine public).
      - name: Préparer la carte du monde
        run: |
          mkdir -p app/src/main/assets
          BASE=https://raw.githubusercontent.com/nvkelso/natural-earth-vector
          curl -sSfL "$BASE/v5.1.2/geojson/ne_110m_land.geojson" -o /tmp/land.geojson \
            || curl -sSfL "$BASE/master/geojson/ne_110m_land.geojson" -o /tmp/land.geojson
          python3 tools/make_land.py /tmp/land.geojson app/src/main/assets/land.bin
          # Version détaillée (1:50m), utilisée quand on zoome sur le globe.
          curl -sSfL "$BASE/v5.1.2/geojson/ne_50m_land.geojson" -o /tmp/land50.geojson \
            || curl -sSfL "$BASE/master/geojson/ne_50m_land.geojson" -o /tmp/land50.geojson
          python3 tools/make_land.py /tmp/land50.geojson app/src/main/assets/land50.bin
          curl -sSfL "$BASE/v5.1.2/geojson/ne_110m_admin_0_countries.geojson" -o /tmp/countries.geojson \
            || curl -sSfL "$BASE/master/geojson/ne_110m_admin_0_countries.geojson" -o /tmp/countries.geojson
          python3 tools/make_countries.py /tmp/countries.geojson app/src/main/assets/countries.txt

      # Le copier-coller depuis un téléphone ajoute parfois des espaces ou caractères invisibles :
      # on ne garde que les caractères attendus avant de vérifier la clé.
      - name: Préparer la clé et compiler
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_RAW: ${{ secrets.KEYSTORE_PASSWORD }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          chmod +x gradlew
          if [ "$IS_PR" != "true" ]; then
            if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD_RAW" ]; then
              echo "::error::Il manque les secrets KEYSTORE_BASE64 et/ou KEYSTORE_PASSWORD."
              exit 1
            fi
            KEYSTORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD_RAW" | tr -cd 'A-Za-z0-9')"
            export KEYSTORE_PASSWORD
            echo "Mot de passe : ${#KEYSTORE_PASSWORD} caractères utiles (32 attendus)."
            if [ "${#KEYSTORE_PASSWORD}" -ne 32 ]; then
              echo "::error::Le secret KEYSTORE_PASSWORD doit contenir les 32 caractères de KEYSTORE_PASSWORD.txt."
              exit 1
            fi
            printf '%s' "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 --decode > app/release.keystore
            if ! keytool -list -keystore app/release.keystore -storepass "$KEYSTORE_PASSWORD" -alias radioonde > /dev/null 2>&1; then
              echo "::error::La clé ne s'ouvre pas : vérifie que KEYSTORE_BASE64 contient tout KEYSTORE_BASE64.txt et que le mot de passe correspond."
              exit 1
            fi
            echo "Clé de signature OK."
          fi
          ./gradlew assembleRelease --stacktrace

      - name: Renommer l'APK
        run: |
          mkdir -p dist
          # Nom fixe : https://github.com/SickB0oy/radio-onde/releases/latest/download/RadioOnde.apk
          # télécharge toujours la dernière version.
          cp app/build/outputs/apk/release/*.apk dist/RadioOnde.apk

      - name: Mettre l'APK à disposition
        uses: actions/upload-artifact@v4
        with:
          name: RadioOnde-apk
          path: dist/*.apk

      # Chaque envoi sur main publie (ou met à jour) la version « v<versionName> » dans Releases.
      # Pour une nouvelle version, augmenter versionCode et versionName dans app/build.gradle.kts.
      - name: Publier la version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Radio Onde ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          generate_release_notes: true
